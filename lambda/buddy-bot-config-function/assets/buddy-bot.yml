name: Buddy Bot PR Notification

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR event to Buddy Bot
        env:
          BUDDY_BOT_URL: __BUDDY_BOT_URL__
          BUDDY_BOT_SECRET: ${{ secrets.BUDDY_BOT_WEBHOOK_SECRET }}
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          printf '%s' "$EVENT_JSON" > /tmp/payload.json
          SIG=$(openssl dgst -sha256 -hmac "$BUDDY_BOT_SECRET" /tmp/payload.json | awk '{print "sha256=" $2}')
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "@/tmp/payload.json" \
            "$BUDDY_BOT_URL"
